<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>盲评 A/B</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="title">盲评 <span class="sub">左 vs 右(不知道两侧各是什么)</span></div>
  <div class="progress-wrap">
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-text">0 / 0</div>
  </div>
  <div class="nav">
    <button id="btn-prev">← 上一条</button>
    <button id="btn-next">下一条 →</button>
    <button id="btn-jump">跳到第一条未评</button>
    <button id="btn-reveal" class="danger">揭盲看结果</button>
    <button id="btn-review" class="review-off">回顾模式:关</button>
    <select id="filter" class="hidden">
      <option value="all">全部</option>
      <option value="key0">仅被检验方胜</option>
      <option value="key1">仅基线胜</option>
      <option value="tie">仅平局</option>
      <option value="unmarked">仅未评</option>
    </select>
  </div>
</header>

<main>
  <div id="task-question"></div>
  <div id="task-info">
    <span id="task-label">-</span>
    <span id="task-prompt"></span>
  </div>
  <div id="verdict" class="hidden"></div>
  <div id="refs"></div>
  <div id="cands">
    <div class="cand" id="cand-a">
      <div class="cand-label">左<span id="badge-a" class="badge hidden"></span></div>
      <img id="img-a" alt="左">
    </div>
    <div class="cand" id="cand-b">
      <div class="cand-label">右<span id="badge-b" class="badge hidden"></span></div>
      <img id="img-b" alt="右">
    </div>
  </div>
  <div id="actions">
    <button class="choice" data-choice="L">左更好 <kbd>1</kbd></button>
    <button class="choice" data-choice="tie">一样好 <kbd>2</kbd>/<kbd>↓</kbd></button>
    <button class="choice" data-choice="R">右更好 <kbd>3</kbd></button>
  </div>
  <div id="status"></div>
</main>

<div id="modal" class="hidden">
  <div id="modal-body">
    <h2>揭盲结果</h2>
    <div id="modal-content"></div>
    <button id="modal-close">关闭</button>
  </div>
</div>

<script src="/static/blind.js"></script>
</body>
</html>
